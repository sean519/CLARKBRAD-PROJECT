<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clark · Video</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500;700&family=Audiowide&display=swap');
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 12% 8%,  rgba(40, 130, 220, 0.40), transparent 38%),
        radial-gradient(ellipse at 88% 16%, rgba(20, 100, 200, 0.34), transparent 36%),
        radial-gradient(ellipse at 55% 92%, rgba(20, 180, 220, 0.28), transparent 42%),
        #04081a;
      color: #e8f0fe;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: 32px;
    }
    .stars { position: fixed; inset: -50%; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 13% 22%, #fff, transparent 60%),
        radial-gradient(1px 1px   at 27% 78%, #cfe6ff, transparent 60%),
        radial-gradient(2px 2px   at 41% 14%, #fff, transparent 60%),
        radial-gradient(1px 1px   at 58% 64%, #aee0ff, transparent 60%),
        radial-gradient(1.5px 1.5px at 72% 36%, #fff, transparent 60%),
        radial-gradient(1px 1px   at 84% 82%, #d4ecff, transparent 60%);
      background-size: 100% 100%;
      animation: twinkle 4s ease-in-out infinite alternate;
      opacity: 0.7;
    }
    @keyframes twinkle { from { opacity: 0.3; } to { opacity: 0.95; } }

    .frame { position: relative; z-index: 2; max-width: 640px; width: 100%; }
    .icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #b0e8ff, #7fc4e8);
      color: #fff;
      font-size: 48px;
      box-shadow: 0 0 56px rgba(176,232,255,0.55);
      margin-bottom: 26px;
      animation: floaty 4s ease-in-out infinite alternate;
    }
    @keyframes floaty { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    h1 {
      font-family: 'Audiowide', 'Orbitron', sans-serif;
      font-size: clamp(36px, 5vw, 60px);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 0%, #b0e8ff 38%, #67e8f9 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin: 0 0 16px;
    }
    .tag {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(176,232,255,0.14);
      border: 1px solid rgba(176,232,255,0.45);
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: #b0e8ff; font-weight: 800;
      margin-bottom: 22px;
    }
    p { color: rgba(220, 232, 255, 0.78); font-size: 15px; line-height: 1.6; margin: 0 0 32px; }
    .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04);
      color: #e8f0fe;
      text-decoration: none;
      font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
      transition: background 200ms, transform 200ms, border-color 200ms;
    }
    .btn:hover { transform: translateY(-2px); background: rgba(176,232,255,0.18); border-color: #b0e8ff; }
    .btn-primary { background: linear-gradient(135deg, #b0e8ff, #67e8f9); color: #04101e; border-color: transparent; }
    .btn-primary:hover { transform: translateY(-2px) scale(1.04); }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="frame">
    <div class="icon" aria-hidden="true"><i class="fa-solid fa-video"></i></div>
    <span class="tag">Clark · Video</span>
    <h1>Clips &amp; Films</h1>
    <p>This page is a placeholder — drop your video page into <code style="background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:4px;color:#b0e8ff">Clark/video/index.html</code> (replacing this file) and it'll be live.</p>
    <div class="actions">
      <a class="btn" href="../index.html"><i class="fa-solid fa-arrow-left"></i> Clark Hub</a>
      <a class="btn btn-primary" href="../game/index.html">Play Game <i class="fa-solid fa-arrow-right"></i></a>
    </div>
  </main>
  <script>
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") window.location.href = "../index.html"; });
  </script>
</body>
</html>
