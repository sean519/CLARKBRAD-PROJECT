<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clark · Video</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500;700&family=Audiowide&display=swap');

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(ellipse at 12% 8%, rgba(40,130,220,0.40), transparent 38%),
        radial-gradient(ellipse at 88% 16%, rgba(20,100,200,0.34), transparent 36%),
        radial-gradient(ellipse at 55% 92%, rgba(20,180,220,0.28), transparent 42%),
        #04081a;

      color: #e8f0fe;
      font-family: 'Space Grotesk', system-ui, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 40px 20px;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: -50%;
      pointer-events: none;
      z-index: 0;

      background-image:
        radial-gradient(1.5px 1.5px at 13% 22%, #fff, transparent 60%),
        radial-gradient(1px 1px at 27% 78%, #cfe6ff, transparent 60%),
        radial-gradient(2px 2px at 41% 14%, #fff, transparent 60%),
        radial-gradient(1px 1px at 58% 64%, #aee0ff, transparent 60%),
        radial-gradient(1.5px 1.5px at 72% 36%, #fff, transparent 60%),
        radial-gradient(1px 1px at 84% 82%, #d4ecff, transparent 60%);

      animation: twinkle 4s ease-in-out infinite alternate;
      opacity: 0.7;
    }

    @keyframes twinkle {
      from { opacity: 0.3; }
      to { opacity: 0.95; }
    }

    .frame {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1200px;
      text-align: center;
    }

    .icon {
      width: 110px;
      height: 110px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #b0e8ff, #7fc4e8);
      font-size: 48px;
      color: white;
      box-shadow: 0 0 56px rgba(176,232,255,0.55);
      animation: floaty 4s ease-in-out infinite alternate;
    }

    @keyframes floaty {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }

    .tag {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(176,232,255,0.14);
      border: 1px solid rgba(176,232,255,0.45);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #b0e8ff;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 18px;
      font-family: 'Audiowide', 'Orbitron', sans-serif;
      font-size: clamp(38px, 5vw, 64px);
      background: linear-gradient(135deg, #fff 0%, #b0e8ff 38%, #67e8f9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      max-width: 720px;
      margin: 0 auto 40px;
      color: rgba(220,232,255,0.82);
      line-height: 1.7;
      font-size: 16px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
      align-items: start;
      margin-bottom: 50px;
    }

    .video-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 26px;
      padding: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0,0,0,0.25);
      transition: transform 0.25s ease;
    }

    .video-card:hover {
      transform: translateY(-6px);
    }

    .video-card h3 {
      margin: 0 0 14px;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #b0e8ff;
    }

    iframe {
      width: 100%;
      border: 0;
      border-radius: 18px;
    }

    .video iframe {
      aspect-ratio: 16 / 9;
    }

    .short iframe {
      aspect-ratio: 9 / 16;
      max-height: 620px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #e8f0fe;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.16);
      transition: 0.25s ease;
    }

    .btn:hover {
      background: rgba(176,232,255,0.18);
      border-color: #b0e8ff;
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #b0e8ff, #67e8f9);
      color: #04101e;
      border: none;
    }

    @media (max-width: 700px) {
      body {
        padding: 24px 14px;
      }

      .video-grid {
        grid-template-columns: 1fr;
      }

      .short iframe {
        max-height: 560px;
      }
    }
  </style>
</head>

<body>

  <div class="stars"></div>

  <main class="frame">

    <div class="icon">
      <i class="fa-solid fa-video"></i>
    </div>

    <div class="tag">Clark · Video</div>

    <h1>Clips & Films</h1>

    <p>
      Watch Clark's latest videos and YouTube shorts from the universe.
    </p>

    <div class="video-grid">

      <div class="video-card short">
        <h3>YouTube Short</h3>

        <iframe
          src="https://www.youtube.com/embed/GCqvEXZm--Y"
          title="Clark Short"
          allowfullscreen>
        </iframe>
      </div>

      <div class="video-card video">
        <h3>YouTube Video</h3>

        <iframe
          src="https://www.youtube.com/embed/luzg_pkY97k"
          title="Clark Video"
          allowfullscreen>
        </iframe>
      </div>

      <div class="video-card video">
        <h3>YouTube Video</h3>

        <iframe
          src="https://www.youtube.com/embed/luzg_pkY97k"
          title="Clark Video 2"
          allowfullscreen>
        </iframe>
      </div>

    </div>

  </main>

</body>
</html>
